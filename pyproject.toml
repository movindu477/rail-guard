[project]
name = "railguard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "ultralytics",
    "torch",
    "torchvision",
]

[project.optional-dependencies]
alerts = ["firebase-admin"]   # railguard.alerts.publisher: BRAKE NOW hazards to Firestore

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["railguard*"]
